<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvoiceBuddy - AI-Powered Invoice Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script> <!-- PDF KE LIYE -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5',
                        secondary: '#818cf8',
                        accent: '#fbbf24',
                        dark: '#1e293b'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }
        /* Invoice Header with Blue to Purple Gradient */
.invoice-header {
  background: linear-gradient(90deg, #2563EB 0%, #7C3AED 100%);
  color: white;
  padding: 25px;
  text-align: center;
  border-radius: 10px 10px 0 0;
  margin-bottom: 20px;
}
.invoice-header h1 {
  margin: 0;
  font-size: 28px;
  letter-spacing: 2px;
}

/* Table Header Purple */
.items-table thead {
  background: #7C3AED;
  color: white;
}

/* Total Box Blue Border */
.total-section {
  background: #EFF6FF;
  border-left: 5px solid #2563EB;
  padding: 15px;
  margin-top: 20px;
  border-radius: 5px;
}
.total-section .total-amount {
  color: #7C3AED;
  font-size: 20px;
  font-weight: bold;
}
        .invoice-template {
            transition: all 0.3s ease;
        }
        .template-card {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .template-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .item-row:hover {
            background-color: #f8fafc;
        }
        .invoice-header {
  background: linear-gradient(90deg, #2563EB 0%, #7C3AED 100%);
  color: white;
  padding: 20px;
  border-radius: 8px 8px 0 0;
}
.table-header {
  background: #7C3AED;
  color: white;
}
.total-box {
  background: #EFF6FF;
  border-left: 4px solid #2563EB;
  color: #7C3AED;
  font-weight: bold;
}
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <!-- Navigation - SAME AS YOURS -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0 flex items-center">
                        <i class="fas fa-file-invoice-dollar text-primary text-2xl mr-2"></i>
                        <span class="font-bold text-xl text-dark">Invoice<span class="text-primary">Buddy</span></span>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <button id="scrollToForm" class="hidden md:block bg-primary hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition duration-200">
                        Create Invoice
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section - SAME AS YOURS -->
    <section class="relative bg-gradient-to-br from-primary to-indigo-700 text-white py-20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h1 class="text-4xl md:text-5xl font-extrabold leading-tight">
                Invoice Clients in 30 Seconds,<br>
                <span class="text-accent">Get Paid Faster</span>
            </h1>
            <p class="text-xl text-indigo-100 max-w-2xl mx-auto mt-4">
                Free AI-powered invoice generator. No signup. No credit card.
            </p>
        </div>
    </section>

    <!-- Invoice Creator Form -->
    <section id="invoiceForm" class="py-16 bg-white">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center mb-12">
                <h2 class="text-3xl font-bold text-dark mb-4">Create New Invoice</h2>
            </div>
            
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Form Section -->
                <div class="lg:col-span-2">
                    <form id="invoiceFormElement" class="space-y-8">
                        <!-- From Section -->
                        <div class="bg-gray-50 p-6 rounded-xl shadow-sm">
                            <h3 class="text-lg font-semibold text-dark mb-4">From</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Your Name</label>
                                    <input id="fromName" type="text" class="w-full px-4 py-2 border border-gray-300 rounded-lg" placeholder="Enter your full name">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Your Email</label>
                                    <input id="fromEmail" type="email" class="w-full px-4 py-2 border-gray-300 rounded-lg" placeholder="Enter your email">
                                </div>
                            </div>
                        </div>

                        <!-- To Section -->
                        <div class="bg-gray-50 p-6 rounded-xl shadow-sm">
                            <h3 class="text-lg font-semibold text-dark mb-4">To</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Client Name</label>
                                    <input id="toName" type="text" class="w-full px-4 py-2 border border-gray-300 rounded-lg" placeholder="Enter client's full name">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Client Email</label>
                                    <input id="toEmail" type="email" class="w-full px-4 py-2 border border-gray-300 rounded-lg" placeholder="Enter client's email">
                                </div>
                            </div>
                        </div>

                        <!-- Invoice Details -->
                        <div class="bg-gray-50 p-6 rounded-xl shadow-sm">
                            <h3 class="text-lg font-semibold text-dark mb-4">Invoice Details</h3>
                            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Invoice #</label>
                                    <input id="invoiceNumber" type="text" class="w-full px-4 py-2 border-gray-300 rounded-lg" value="INV-2023-001">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Currency</label>
                                    <select id="currency" class="w-full px-4 py-2 border-gray-300 rounded-lg">
                                        <option>USD ($)</option>
                                        <option>PKR (₨)</option>
                                        <option>EUR (€)</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Tax %</label>
                                    <input id="taxRate" type="number" class="w-full px-4 py-2 border border-gray-300 rounded-lg" value="10">
                                </div>
                            </div>
                        </div>

                        <!-- Line Items -->
                        <div class="bg-gray-50 p-6 rounded-xl shadow-sm">
                            <div class="flex justify-between items-center mb-4">
                                <h3 class="text-lg font-semibold text-dark">Line Items</h3>
                                <button type="button" id="addItemBtn" class="bg-primary text-white px-4 py-2 rounded-lg text-sm">
                                    <i class="fas fa-plus mr-1"></i> Add Item
                                </button>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="min-w-full">
                                    <thead class="bg-gray-100">
                                        <tr>
                                            <th class="px-4 py-3 text-left text-xs font-medium">Description</th>
                                            <th class="px-4 py-3 text-left text-xs font-medium">Qty</th>
                                            <th class="px-4 py-3 text-left text-xs font-medium">Rate</th>
                                            <th class="px-4 py-3 text-left text-xs font-medium">Amount</th>
                                            <th class="px-4 py-3"></th>
                                        </tr>
                                    </thead>
                                    <tbody id="itemsTableBody">
                                        <tr class="item-row">
                                            <td class="px-4 py-3"><input type="text" class="desc w-full border rounded px-2 py-1" placeholder="Service description"></td>
                                            <td class="px-4 py-3"><input type="number" class="qty w-20 border rounded px-2 py-1" value="1"></td>
                                            <td class="px-4 py-3"><input type="number" class="rate w-28 border rounded px-2 py-1" value="0"></td>
                                            <td class="px-4 py-3 text-right font-medium amount">$0.00</td>
                                            <td class="px-4 py-3"><button type="button" class="deleteBtn text-red-500"><i class="fas fa-trash"></i></button></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            
                            <!-- TOTALS SECTION - NEW -->
                            <div class="mt-6 flex justify-end">
                                <div class="w-64 space-y-2">
                                    <div class="flex justify-between"><span>Subtotal:</span> <span id="subtotal">$0.00</span></div>
                                    <div class="flex justify-between"><span>Tax:</span> <span id="taxAmount">$0.00</span></div>
                                    <div class="flex justify-between font-bold text-lg border-t pt-2"><span>Total:</span> <span id="total">$0.00</span></div>
                                </div>
                            </div>
                        </div>

                        <!-- DOWNLOAD BUTTON - NEW -->
                        <div class="flex justify-center">
                            <button type="button" id="downloadPdfBtn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-lg text-lg">
                                <i class="fas fa-download mr-2"></i> Download PDF
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

<script>
const { jsPDF } = window.jspdf;
let itemCount = 1;

function calculate() {
    let subtotal = 0;
    document.querySelectorAll('#itemsTableBody tr').forEach(row => {
        const qty = parseFloat(row.querySelector('.qty').value) || 0;
        const rate = parseFloat(row.querySelector('.rate').value) || 0;
        const amount = qty * rate;
        row.querySelector('.amount').textContent = formatCurrency(amount);
        subtotal += amount;
    });
    
    const taxRate = parseFloat(document.getElementById('taxRate').value) || 0;
    const tax = subtotal * (taxRate / 100);
    const total = subtotal + tax;
    
    document.getElementById('subtotal').textContent = formatCurrency(subtotal);
    document.getElementById('taxAmount').textContent = formatCurrency(tax);
    document.getElementById('total').textContent = formatCurrency(total);
}

function formatCurrency(num) {
    const currency = document.getElementById('currency').value;
    const symbol = currency.includes('PKR') ? '₨' : currency.includes('EUR') ? '€' : '$';
    return symbol + num.toFixed(2);
}

document.getElementById('addItemBtn').addEventListener('click', () => {
    const tbody = document.getElementById('itemsTableBody');
    const newRow = tbody.querySelector('tr').cloneNode(true);
    newRow.querySelectorAll('input').forEach(i => i.value = i.classList.contains('qty') ? 1 : 0);
    tbody.appendChild(newRow);
    attachListeners(newRow);
});

function attachListeners(row) {
    row.querySelectorAll('.qty, .rate').forEach(i => i.addEventListener('input', calculate));
    row.querySelector('.deleteBtn').addEventListener('click', () => {
        if(document.querySelectorAll('#itemsTableBody tr').length > 1) row.remove();
        calculate();
    });
}

document.getElementById('taxRate').addEventListener('input', calculate);
document.getElementById('currency').addEventListener('change', calculate);
attachListeners(document.querySelector('#itemsTableBody tr'));
calculate();

// PDF DOWNLOAD
document.getElementById('downloadPdfBtn').addEventListener('click', () => {
    const doc = new jsPDF();
    doc.setFontSize(18);
    doc.text("INVOICE", 14, 20);
    doc.setFontSize(11);
    doc.text(`From: ${document.getElementById('fromName').value}`, 14, 35);
    doc.text(`To: ${document.getElementById('toName').value}`, 14, 45);
    doc.text(`Total: ${document.getElementById('total').textContent}`, 14, 60);
    doc.save(`Invoice-${document.getElementById('invoiceNumber').value}.pdf`);
});
</script>

</body>
</html>
