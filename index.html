<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvoiceBuddy - AI-Powered Invoice Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5',
                        secondary: '#818cf8',
                        accent: '#fbbf24',
                        dark: '#1e293b'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
        .total-box {
          background: #EFF6FF;
          border-left: 5px solid #2563EB;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <i class="fas fa-file-invoice-dollar text-indigo-600 text-2xl mr-2"></i>
                    <span class="font-bold text-xl text-dark">Invoice<span class="text-indigo-600">Buddy</span></span>
                </div>
            </div>
        </div>
    </nav>

    <section class="relative bg-gradient-to-br from-indigo-600 to-indigo-800 text-white py-20">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <h1 class="text-4xl md:text-5xl font-extrabold">Invoice Clients in 30 Seconds</h1>
        </div>
    </section>

    <section id="invoiceForm" class="py-16 bg-white">
        <div class="max-w-7xl mx-auto px-4">
            <h2 class="text-3xl font-bold text-center mb-12">Create New Invoice</h2>
            <form id="invoiceFormElement" class="space-y-8">
                <!-- From, To, Details same as before -->
                <div class="bg-gray-50 p-6 rounded-xl shadow-sm">
                    <h3 class="text-lg font-semibold mb-4">From</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input id="fromName" type="text" class="w-full px-4 py-2 border rounded-lg" placeholder="Your Name">
                        <input id="fromEmail" type="email" class="w-full px-4 py-2 border rounded-lg" placeholder="Your Email">
                    </div>
                </div>
                <div class="bg-gray-50 p-6 rounded-xl shadow-sm">
                    <h3 class="text-lg font-semibold mb-4">To</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input id="toName" type="text" class="w-full px-4 py-2 border rounded-lg" placeholder="Client Name">
                        <input id="toEmail" type="email" class="w-full px-4 py-2 border rounded-lg" placeholder="Client Email">
                    </div>
                </div>
                <div class="bg-gray-50 p-6 rounded-xl shadow-sm">
                    <h3 class="text-lg font-semibold mb-4">Invoice Details</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <input id="invoiceNumber" type="text" class="w-full px-4 py-2 border rounded-lg" value="INV-001">
                        <select id="currency" class="w-full px-4 py-2 border rounded-lg"><option>USD ($)</option><option>PKR (₨)</option></select>
                        <input id="taxRate" type="number" class="w-full px-4 py-2 border rounded-lg" value="10">
                    </div>
                </div>

                <!-- Line Items -->
                <div class="bg-gray-50 p-6 rounded-xl shadow-sm">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-semibold">Line Items</h3>
                        <button type="button" id="addItemBtn" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm">
                            <i class="fas fa-plus mr-1"></i> Add Item
                        </button>
                    </div>
                    <table class="min-w-full">
                        <thead class="bg-purple-600 text-white">
                            <tr>
                                <th class="px-4 py-3 text-left">Item</th>
                                <th class="px-4 py-3 text-left">Quantity</th>
                                <th class="px-4 py-3 text-left">Unit Price</th>
                                <th class="px-4 py-3 text-left">Amount</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="itemsTableBody">
                            <tr>
                                <td class="px-4 py-3"><input type="text" class="desc w-full border rounded px-2 py-1"></td>
                                <td class="px-4 py-3"><input type="number" class="qty w-20 border rounded px-2 py-1" value="1"></td>
                                <td class="px-4 py-3"><input type="number" class="rate w-28 border rounded px-2 py-1" value="0"></td>
                                <td class="px-4 py-3 text-right font-medium amount">$0.00</td>
                                <td class="px-4 py-3"><button type="button" class="deleteBtn text-red-500"><i class="fas fa-trash"></i></button></td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="mt-6 flex justify-end">
                        <div class="w-64 space-y-2 total-box p-4 rounded-lg">
                            <div class="flex justify-between"><span>Subtotal:</span> <span id="subtotal">$0.00</span></div>
                            <div class="flex justify-between"><span>Tax:</span> <span id="taxAmount">$0.00</span></div>
                            <div class="flex justify-between font-bold text-lg border-t pt-2 text-purple-700"><span>Total:</span> <span id="total">$0.00</span></div>
                        </div>
                    </div>
                </div>

                <div class="flex justify-center">
                    <button type="button" id="downloadPdfBtn" class="bg-gradient-to-r from-blue-600 to-purple-600 text-white font-bold py-3 px-8 rounded-lg">
                        <i class="fas fa-download mr-2"></i> Download PDF
                    </button>
                </div>
            </form>
        </div>
    </section>

<script>
const { jsPDF } = window.jspdf;

function formatCurrency(num) {
    const currency = document.getElementById('currency').value;
    const symbol = currency.includes('PKR') ? '₨' : currency.includes('EUR') ? '€' : '$';
    const number = parseFloat(num) || 0;
    return symbol + number.toFixed(2);
}

function calculate() {
    let subtotal = 0;
    document.querySelectorAll('#itemsTableBody tr').forEach(row => {
        const qty = parseFloat(row.querySelector('.qty').value) || 0;
        const rate = parseFloat(row.querySelector('.rate').value) || 0;
        const amount = qty * rate;
        row.querySelector('.amount').textContent = formatCurrency(amount);
        subtotal += amount;
    });
    
    const taxRate = parseFloat(document.getElementById('taxRate').value) || 0;
    const tax = subtotal * (taxRate / 100);
    const total = subtotal + tax;
    
    document.getElementById('subtotal').textContent = formatCurrency(subtotal);
    document.getElementById('taxAmount').textContent = formatCurrency(tax);
    document.getElementById('total').textContent = formatCurrency(total);
}

function attachListeners(row) {
    row.querySelectorAll('.qty, .rate, .desc').forEach(i => i.addEventListener('input', calculate));
    row.querySelector('.deleteBtn').addEventListener('click', () => {
        if(document.querySelectorAll('#itemsTableBody tr').length > 1) row.remove();
        calculate();
    });
}

document.getElementById('addItemBtn').addEventListener('click', () => {
    const tbody = document.getElementById('itemsTableBody');
    const newRow = tbody.querySelector('tr').cloneNode(true);
    newRow.querySelectorAll('input').forEach(i => i.value = i.classList.contains('qty') ? 1 : 0);
    tbody.appendChild(newRow);
    attachListeners(newRow); // <-- یہ لائن سب سے اہم تھی
    calculate();
});

document.getElementById('taxRate').addEventListener('input', calculate);
document.getElementById('currency').addEventListener('change', calculate);
attachListeners(document.querySelector('#itemsTableBody tr'));
calculate();

// PDF DOWNLOAD
document.getElementById('downloadPdfBtn').addEventListener('click', () => {
    const doc = new jsPDF();
    doc.setFillColor(37, 99, 235); doc.rect(0, 0, 210, 30, 'F');
    doc.setFillColor(124, 58, 237); doc.rect(105, 0, 105, 30, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(22);
    doc.text("INVOICE", 105, 20, {align: "center"});
    
    doc.setTextColor(0,0,0); doc.setFontSize(11);
    doc.text(`From: ${document.getElementById('fromName').value}`, 14, 45);
    doc.text(`To: ${document.getElementById('toName').value}`, 14, 55);
    doc.text(`Invoice #: ${document.getElementById('invoiceNumber').value}`, 140, 45);

    const tableData = [];
    document.querySelectorAll('#itemsTableBody tr').forEach(row => {
        const desc = row.querySelector('.desc').value;
        const qty = parseFloat(row.querySelector('.qty').value) || 0;
        const rate = parseFloat(row.querySelector('.rate').value) || 0;
        const amount = qty * rate;
        tableData.push([desc, qty, formatCurrency(rate), formatCurrency(amount)]);
    });

    doc.autoTable({
        startY: 70,
        head: [['Item', 'Quantity', 'Unit Price', 'Amount']],
        body: tableData,
        headStyles: { fillColor: [124, 58, 237] }
    });

    const finalY = doc.lastAutoTable.finalY + 10;
    doc.text(`Subtotal: ${document.getElementById('subtotal').textContent}`, 140, finalY);
    doc.text(`Tax: ${document.getElementById('taxAmount').textContent}`, 140, finalY + 7);
    doc.setTextColor(124, 58, 237); doc.setFontSize(14);
    doc.text(`Total: ${document.getElementById('total').textContent}`, 140, finalY + 15);

    doc.save(`Invoice-${document.getElementById('invoiceNumber').value}.pdf`);
});
</script>
</body>
</html>
